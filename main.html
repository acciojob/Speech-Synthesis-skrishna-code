<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Synthesis Application</title>
</head>

<body>

  <h1>Text to Speech</h1>

  <textarea id="text" rows="8" cols="50"
    placeholder="Enter text here..."></textarea>

  <br><br>

  <label for="voiceSelect">Voice:</label>
  <select id="voiceSelect">
    <option value="">Loading voices...</option>
  </select>

  <br><br>

  <label for="rate">
    Rate:
    <span id="rateValue">1</span>
  </label>
  <input
    type="range"
    id="rate"
    min="0.1"
    max="2"
    value="1"
    step="0.1"
  >

  <br><br>

  <label for="pitch">
    Pitch:
    <span id="pitchValue">1</span>
  </label>
  <input
    type="range"
    id="pitch"
    min="0"
    max="2"
    value="1"
    step="0.1"
  >

  <br><br>

  <button id="speak">Speak</button>
  <button id="stop">Stop</button>

  <p id="message"></p>

  <script>
    const text = document.getElementById("text");
    const voiceSelect = document.getElementById("voiceSelect");
    const speakButton = document.getElementById("speak");
    const stopButton = document.getElementById("stop");
    const rate = document.getElementById("rate");
    const pitch = document.getElementById("pitch");
    const rateValue = document.getElementById("rateValue");
    const pitchValue = document.getElementById("pitchValue");
    const message = document.getElementById("message");

    let voices = [];

    // Get available voices
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();

      voiceSelect.innerHTML = "";

      if (voices.length === 0) {
        const option = document.createElement("option");
        option.textContent = "No voices available";
        option.value = "";
        voiceSelect.appendChild(option);
        message.textContent = "No voices are available.";
        return;
      }

      message.textContent = "";

      voices.forEach((voice, index) => {
        const option = document.createElement("option");

        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;

        voiceSelect.appendChild(option);
      });
    }

    // Voices may load asynchronously in some browsers
    window.speechSynthesis.onvoiceschanged = loadVoices;

    // Also try loading immediately
    loadVoices();

    // Speak function
    function speakText() {
      const inputText = text.value.trim();

      // Prevent speech if text is empty
      if (inputText === "") {
        message.textContent = "Please enter some text.";
        return;
      }

      if (voices.length === 0) {
        message.textContent = "No voices are available.";
        return;
      }

      // Stop existing speech
      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(inputText);

      const selectedVoice = voices[voiceSelect.value];

      if (selectedVoice) {
        speech.voice = selectedVoice;
      }

      speech.rate = parseFloat(rate.value);
      speech.pitch = parseFloat(pitch.value);

      speech.onstart = function () {
        message.textContent = "Speaking...";
      };

      speech.onend = function () {
        message.textContent = "Speech finished.";
      };

      speech.onerror = function () {
        message.textContent = "An error occurred while speaking.";
      };

      window.speechSynthesis.speak(speech);
    }

    // Stop speech
    function stopSpeech() {
      window.speechSynthesis.cancel();
      message.textContent = "Speech stopped.";
    }

    // Speak button
    speakButton.addEventListener("click", speakText);

    // Stop button
    stopButton.addEventListener("click", stopSpeech);

    // Rate slider
    rate.addEventListener("input", function () {
      rateValue.textContent = rate.value;

      // Restart speech with new rate if currently speaking
      if (window.speechSynthesis.speaking) {
        speakText();
      }
    });

    // Pitch slider
    pitch.addEventListener("input", function () {
      pitchValue.textContent = pitch.value;

      // Restart speech with new pitch if currently speaking
      if (window.speechSynthesis.speaking) {
        speakText();
      }
    });

    // Change voice while speaking
    voiceSelect.addEventListener("change", function () {
      if (window.speechSynthesis.speaking) {
        speakText();
      }
    });
  </script>

</body>
</html>
